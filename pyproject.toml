[project]
name = "fcul-agentic-ai-class"
version = "0.1.0"
description = "Workshop: building a GitHub-issue classifier with agentic coding tools"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "jinja2>=3.1.6",
    "lxml>=6.1.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
